
{% extends "base.html" %}

{% block title %}Editar Insumo{% endblock %}

{% block content %}

<div class="formulario">
    <h2>Editar Insumo</h2>

    <form method="POST">
        <label for="nome">Nome do insumo *</label>
        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ insumo['nome'] }}"
            required
        >

        <label for="quantidade">Quantidade *</label>
        <input
            type="number"
            id="quantidade"
            name="quantidade"
            value="{{ insumo['quantidade'] }}"
            step="0.01"
            min="0.01"
            required
        >

        <label for="unidade">Unidade de medida *</label>
        <select id="unidade" name="unidade" required>
            <option value="">Selecione uma unidade</option>
            <option value="kg" {% if insumo['unidade'] == 'kg' %}selected{% endif %}>Quilograma (kg)</option>
            <option value="g" {% if insumo['unidade'] == 'g' %}selected{% endif %}>Grama (g)</option>
            <option value="L" {% if insumo['unidade'] == 'L' %}selected{% endif %}>Litro (L)</option>
            <option value="mL" {% if insumo['unidade'] == 'mL' %}selected{% endif %}>Mililitro (mL)</option>
            <option value="un" {% if insumo['unidade'] == 'un' %}selected{% endif %}>Unidade (un)</option>
            <option value="Saco" {% if insumo['unidade'] == 'Saco' %}selected{% endif %}>Saco</option>
        </select>

        <div id="campo-peso-saco"
             {% if insumo['unidade'] != 'Saco' %}style="display: none;"{% endif %}>
            <label for="peso_por_saco">Peso de cada saco (kg) *</label>
            <select id="peso_por_saco" name="peso_por_saco">
                <option value="">Selecione o peso do saco</option>

                {% for peso in [15, 20, 25, 30, 35, 40] %}
                <option
                    value="{{ peso }}"
                    {% if insumo['peso_por_saco'] is not none and insumo['peso_por_saco']|int == peso %}selected{% endif %}
                >
                    {{ peso }} kg
                </option>
                {% endfor %}
            </select>
        </div>

        <label for="preco_total">Preço total da quantidade (R$) *</label>
        <input
            type="number"
            id="preco_total"
            name="preco_total"
            value="{{ insumo['preco_total'] }}"
            step="0.01"
            min="0.01"
            required
        >

        <div class="botoes">
            <button type="submit" class="botao">
                Salvar alterações
            </button>

            <a href="{{ url_for('index') }}" class="cancelar">
                Cancelar
            </a>
        </div>
    </form>
</div>

<script>
    const unidade = document.getElementById("unidade");
    const campoPesoSaco = document.getElementById("campo-peso-saco");
    const pesoPorSaco = document.getElementById("peso_por_saco");

    function atualizarCampoPeso() {
        const selecionouSaco = unidade.value === "Saco";

        campoPesoSaco.style.display = selecionouSaco ? "block" : "none";
        pesoPorSaco.disabled = !selecionouSaco;
        pesoPorSaco.required = selecionouSaco;

        if (!selecionouSaco) {
            pesoPorSaco.value = "";
        }
    }

    unidade.addEventListener("change", atualizarCampoPeso);
    atualizarCampoPeso();
</script>

{% endblock %}
